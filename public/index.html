<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playroom 남은 시간 조회</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="corner"><a class="button-link" href="/admin">🔑 관리자</a></nav>
  <main class="container narrow">
    <section class="hero">
      <h1>🎮 Playroom</h1>
      <p class="muted">이름을 검색하면 내 방과 남은 시간을 확인할 수 있어요.</p>
    </section>

    <form class="search" id="search-form" autocomplete="off">
      <input id="name" name="name" type="search" placeholder="이름 입력 (예: 홍길동)" aria-label="이름" required maxlength="30">
      <button class="primary" type="submit">조회</button>
    </form>

    <section class="card result" id="result" hidden aria-live="polite"></section>
  </main>
  <script type="module" src="/js/student.js"></script>
</body>
</html>
