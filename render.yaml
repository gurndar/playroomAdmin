# Render Blueprint: Render 대시보드 → New → Blueprint → 이 저장소 선택하면 자동 배포됩니다.
services:
  - type: web
    name: playroom-admin
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /api/me
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true   # 대시보드 → Environment 에서 확인/변경
      - key: DURATION_MINUTES
        value: "90"
      - key: TIME_ZONE
        value: Asia/Seoul
